<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kick Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: sans-serif;
      height: 100%;
      overflow: hidden;
    }
    #streamContainer.fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      background: black;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1001;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #controls button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="controls">
    <span id="topStreamerName" class="font-bold">Loading...</span>
    <button id="fullscreenBtn"><i class="fas fa-expand"></i></button>
  </div>

  <div id="streamContainer" class="fullscreen">
    <iframe id="streamIframe" allowfullscreen allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    const streamIframe = document.getElementById("streamIframe");

    const channels = [
      "ac7tionman", "Adinross", "abz", "asianandy", "babyhaze69", "bennymack", 
      "blackassdave", "captaingee", "cellfmade", "chickenandy", "cristravels", 
      "dariusirl", "kangjoel", "hamptonbrando", "hyubsama", "Iceposeidon", 
      "jandro", "jjstream", "lowtiergod", "mando", "noobdog", "sampanday"
    ];

    let liveChannels = [];

    async function fetchChannelData(channel) {
      try {
        const res = await fetch(`https://kick.com/api/v1/channels/${channel}`);
        const data = await res.json();
        const isLive = data.livestream?.is_live || false;
        return {
          name: channel,
          isLive,
          viewers: data.livestream?.viewer_count || 0,
        };
      } catch (e) {
        return { name: channel, isLive: false };
      }
    }

    async function updateTopStream() {
      liveChannels = [];

      for (const ch of channels) {
        const data = await fetchChannelData(ch);
        if (data.isLive) liveChannels.push(data);
      }

      if (liveChannels.length > 0) {
        const top = liveChannels.sort((a, b) => b.viewers - a.viewers)[0];
        topStreamerName.textContent = top.name;
        streamIframe.src = `https://player.kick.com/${top.name}?autoplay=true&muted=false`;
      } else {
        topStreamerName.textContent = "No live streams";
        streamIframe.src = "";
      }
    }

    // Initial and auto refresh every 30 minutes
    updateTopStream();
    setInterval(updateTopStream, 30 * 60 * 1000);
  </script>

</body>
</html>
