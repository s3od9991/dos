<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick TV V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1a2e1a 0%, #2a5a2a 100%);
        }
        .stream-card {
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .stream-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }
        .kick-green {
            background-color: #2a5a2a;
        }
        .kick-light-green {
            background-color: #3a7a3a;
        }
        .refresh-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a2e1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a7a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4a9a4a;
        }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8">
            <div class="flex items-center mb-4 md:mb-0">
                <i class="fas fa-tv text-3xl mr-3 text-green-400"></i>
                <h1 class="text-3xl font-bold text-green-400">KICK TV V2</h1>
            </div>
            <div class="flex items-center space-x-4">
                <div id="datetime" class="flex items-center bg-kick-green px-3 py-2 rounded-lg">
                    <i class="fas fa-clock mr-2"></i>
                    <span id="current-time"></span>
                </div>
                <div id="refresh-info" class="flex items-center bg-kick-green px-3 py-2 rounded-lg">
                    <i class="fas fa-sync-alt mr-2"></i>
                    <span>Next refresh: <span id="countdown">30:00</span></span>
                </div>
                <button id="add-streamer-btn" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg font-semibold transition">
                    <i class="fas fa-plus mr-2"></i>Add Streamer
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Current Top Streamer -->
            <section class="mb-12">
                <h2 class="text-2xl font-semibold mb-4 flex items-center">
                    <i class="fas fa-crown text-yellow-400 mr-2"></i>
                    Current Most Viewed Streamer
                </h2>
                <div id="top-streamer" class="bg-kick-light-green rounded-xl overflow-hidden shadow-lg">
                    <div class="aspect-w-16 aspect-h-9 relative">
                        <iframe id="top-stream-embed" class="w-full h-96" src="" frameborder="0" allowfullscreen allow="autoplay"></iframe>
                    </div>
                    <div class="p-4">
                        <div class="flex justify-between items-center">
                            <h3 id="top-streamer-name" class="text-xl font-bold"></h3>
                            <div class="flex items-center space-x-4">
                                <button id="fullscreen-btn" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded-lg">
                                    <i class="fas fa-expand mr-1"></i> Fullscreen
                                </button>
                                <div class="flex items-center">
                                    <i class="fas fa-eye mr-2"></i>
                                    <span id="top-streamer-viewers" class="font-semibold"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Streamer List -->
            <section>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-semibold flex items-center">
                        <i class="fas fa-list mr-2"></i>
                        Your Streamers
                    </h2>
                    <div class="text-gray-300">
                        <span id="streamer-count">3</span> streamers in list
                    </div>
                </div>
                
                <div id="streamer-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- Streamer cards will be added here dynamically -->
                </div>
            </section>
        </main>

        <!-- Add Streamer Modal -->
        <div id="add-streamer-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50">
            <div class="bg-kick-green rounded-lg p-6 w-full max-w-md">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">Add New Streamer</h3>
                    <button id="close-modal" class="text-gray-300 hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="mb-4">
                    <label for="streamer-name" class="block mb-2">Streamer Username</label>
                    <input type="text" id="streamer-name" placeholder="e.g. xqc" 
                           class="w-full px-4 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:border-green-500">
                </div>
                <div class="flex justify-end space-x-3">
                    <button id="cancel-add" class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600 transition">Cancel</button>
                    <button id="confirm-add" class="px-4 py-2 rounded bg-green-600 hover:bg-green-700 transition">Add Streamer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Default streamers
        let streamers = [
            { name: 'kangjoel', viewers: 0 },
            { name: 'sam', viewers: 0 },
            { name: 'suspendas', viewers: 0 }
        ];

        // DOM elements
        const streamerList = document.getElementById('streamer-list');
        const topStreamEmbed = document.getElementById('top-stream-embed');
        const topStreamerName = document.getElementById('top-streamer-name');
        const topStreamerTitle = document.getElementById('top-streamer-title');
        const topStreamerViewers = document.getElementById('top-streamer-viewers');
        const streamerCount = document.getElementById('streamer-count');
        const countdown = document.getElementById('countdown');
        const addStreamerBtn = document.getElementById('add-streamer-btn');
        const addStreamerModal = document.getElementById('add-streamer-modal');
        const closeModal = document.getElementById('close-modal');
        const cancelAdd = document.getElementById('cancel-add');
        const confirmAdd = document.getElementById('confirm-add');
        const streamerNameInput = document.getElementById('streamer-name');
        const refreshInfo = document.getElementById('refresh-info');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        // Toggle fullscreen for a streamer
        function toggleFullscreen(streamerName) {
            const iframe = document.querySelector(`iframe[src="https://player.kick.com/${streamerName}"]`);
            if (iframe) {
                if (iframe.requestFullscreen) {
                    iframe.requestFullscreen();
                } else if (iframe.webkitRequestFullscreen) {
                    iframe.webkitRequestFullscreen();
                } else if (iframe.msRequestFullscreen) {
                    iframe.msRequestFullscreen();
                }
            }
        }

        // Update current time
        function updateCurrentTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            const dateStr = now.toLocaleDateString();
            document.getElementById('current-time').textContent = `${dateStr} ${timeStr}`;
        }

        // Initialize the app
        function init() {
            renderStreamerList();
            fetchStreamerData();
            startCountdown();
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            
            // Set up event listeners
            addStreamerBtn.addEventListener('click', () => {
                addStreamerModal.classList.remove('hidden');
                streamerNameInput.focus();
            });
            
            closeModal.addEventListener('click', () => addStreamerModal.classList.add('hidden'));
            cancelAdd.addEventListener('click', () => addStreamerModal.classList.add('hidden'));
            
            confirmAdd.addEventListener('click', () => {
                const name = streamerNameInput.value.trim();
                if (name && !streamers.some(s => s.name.toLowerCase() === name.toLowerCase())) {
                    streamers.push({ name, viewers: 0, title: '' });
                    streamerNameInput.value = '';
                    addStreamerModal.classList.add('hidden');
                    renderStreamerList();
                    fetchStreamerData();
                } else if (name) {
                    alert('This streamer is already in your list!');
                }
            });
            
            // Allow Enter key to confirm add
            streamerNameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    confirmAdd.click();
                }
            });
            
            // Clicking outside modal closes it
            addStreamerModal.addEventListener('click', (e) => {
                if (e.target === addStreamerModal) {
                    addStreamerModal.classList.add('hidden');
                }
            });
        }

        // Render the streamer list
        function renderStreamerList() {
            streamerList.innerHTML = '';
            streamerCount.textContent = streamers.length;
            
            // Sort by viewers (descending)
            const sortedStreamers = [...streamers].sort((a, b) => b.viewers - a.viewers);
            
            sortedStreamers.forEach((streamer, index) => {
                const card = document.createElement('div');
                card.className = 'stream-card bg-kick-light-green rounded-lg hover:bg-opacity-80 transition';
                card.innerHTML = `
                    <div class="p-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-lg">${streamer.name}</h3>
                            </div>
                            <div class="flex items-center space-x-4">
                                <span class="flex items-center bg-green-900 px-3 py-1 rounded-lg">
                                    <i class="fas fa-eye mr-2"></i> ${streamer.viewers.toLocaleString()}
                                </span>
                                <button class="fullscreen-btn bg-green-600 hover:bg-green-700 px-2 py-1 rounded-lg" data-name="${streamer.name}">
                                    <i class="fas fa-expand"></i>
                                </button>
                                <button class="remove-btn text-red-400 hover:text-red-300" data-name="${streamer.name}">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                streamerList.appendChild(card);
            });
            
            // Add event listeners to buttons
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const name = e.target.closest('button').getAttribute('data-name');
                    removeStreamer(name);
                });
            });

            document.querySelectorAll('.fullscreen-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const name = e.target.closest('button').getAttribute('data-name');
                    const iframe = document.querySelector(`iframe[src="https://player.kick.com/${name}"]`);
                    if (iframe) {
                        if (iframe.requestFullscreen) {
                            iframe.requestFullscreen();
                        } else if (iframe.webkitRequestFullscreen) {
                            iframe.webkitRequestFullscreen();
                        } else if (iframe.msRequestFullscreen) {
                            iframe.msRequestFullscreen();
                        }
                    }
                });
            });

            fullscreenBtn.addEventListener('click', () => {
                const iframe = document.querySelector('#top-stream-embed');
                if (iframe) {
                    if (iframe.requestFullscreen) {
                        iframe.requestFullscreen();
                    } else if (iframe.webkitRequestFullscreen) {
                        iframe.webkitRequestFullscreen();
                    } else if (iframe.msRequestFullscreen) {
                        iframe.msRequestFullscreen();
                    }
                }
            });
        }

        // Remove a streamer from the list
        function removeStreamer(name) {
            if (confirm(`Remove ${name} from your list?`)) {
                streamers = streamers.filter(s => s.name !== name);
                renderStreamerList();
                updateTopStreamer();
            }
        }

        // Fetch data for all streamers
        async function fetchStreamerData() {
            refreshInfo.innerHTML = '<i class="fas fa-sync-alt refresh-spin mr-2"></i> Updating data...';
            
            try {
                for (const streamer of streamers) {
                    try {
                        const res = await fetch(`https://kick.com/api/v1/channels/${streamer.name}`);
                        const data = await res.json();
                        streamer.viewers = data.livestream?.viewer_count || 0;
                        streamer.title = data.livestream?.session_title || 'No title available';
                    } catch (error) {
                        console.error(`Error fetching data for ${streamer.name}:`, error);
                    }
                }
                
                renderStreamerList();
                updateTopStreamer();
            } catch (error) {
                console.error('Error fetching streamer data:', error);
            } finally {
                // Reset the refresh countdown
                resetCountdown();
            }
        }

        // Update the top streamer display
        function updateTopStreamer() {
            if (streamers.length === 0) {
                topStreamEmbed.src = '';
                topStreamerName.textContent = 'No streamers in list';
                topStreamerTitle.textContent = '';
                topStreamerViewers.textContent = '0';
                return;
            }
            
            // Find the streamer with most viewers
            const topStreamer = streamers.reduce((prev, current) => 
                (prev.viewers > current.viewers) ? prev : current
            );
            
            // Check if currently in fullscreen
            const isFullscreen = document.fullscreenElement === topStreamEmbed;
            
            // Update the top streamer display
            topStreamEmbed.src = `https://player.kick.com/${topStreamer.name}?muted=false`;
            topStreamerName.textContent = topStreamer.name;
            topStreamerTitle.textContent = topStreamer.title;
            topStreamerViewers.textContent = topStreamer.viewers.toLocaleString();
            
            // Re-enter fullscreen if we were in fullscreen before
            if (isFullscreen) {
                setTimeout(() => {
                    toggleFullscreen(topStreamer.name);
                }, 100);
            }
        }

        // Countdown timer for auto-refresh
        let countdownInterval;
        let secondsLeft = 30 * 60; // 30 minutes
        
        function startCountdown() {
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                secondsLeft--;
                
                if (secondsLeft <= 0) {
                    fetchStreamerData();
                    return;
                }
                
                const minutes = Math.floor(secondsLeft / 60);
                const seconds = secondsLeft % 60;
                countdown.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }
        
        function resetCountdown() {
            secondsLeft = 30 * 60;
            const minutes = Math.floor(secondsLeft / 60);
            const seconds = secondsLeft % 60;
            countdown.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            refreshInfo.innerHTML = '<i class="fas fa-sync-alt mr-2"></i> Next refresh: <span id="countdown">30:00</span>';
            startCountdown();
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
